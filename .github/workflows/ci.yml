name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Avoid npm's wasm-pack postinstall (binary-install can pick linux-musl and 404 on releases).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - name: Install dependencies
        run: npm ci

      - name: Verify manifest vs cmd CMD blocks
        run: npm run verify:manifest

      - name: No fetch() in extension pages / SW sources
        run: npm run check:no-fetch

      - name: Generated TS / Rust matches manifest (codegen + git diff)
        run: npm run check:generated

      - name: Build WASM artifacts
        run: npm run build:wasm

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Rust tests (bmxt-core)
        run: cargo test
        working-directory: wasm/bmxt-core
