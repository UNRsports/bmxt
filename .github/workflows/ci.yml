name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify manifest vs cmd CMD blocks
        run: npm run verify:manifest

      - name: No fetch() in extension pages / SW sources
        run: npm run check:no-fetch

      - name: Generated TS matches manifest (codegen + git diff)
        run: npm run check:generated

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build extension
        run: npm run build
