name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare WXT types
        run: pnpm exec wxt prepare

      - name: Audit dependencies (fail on critical severity)
        run: pnpm audit --audit-level critical

      - name: Verify manifest vs cmd CMD blocks
        run: pnpm run verify:manifest

      - name: No fetch() in extension pages / SW sources
        run: pnpm run check:no-fetch

      - name: Generated TS matches manifest (codegen + git diff)
        run: pnpm run check:generated

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build extension
        run: pnpm run build
