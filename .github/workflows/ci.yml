name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.org/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare WXT types
        run: pnpm exec wxt prepare

      - name: Audit dependencies (fail on critical severity)
        run: pnpm audit --audit-level critical

      - name: Verify manifest vs Rust cmd + registry
        run: pnpm run verify:manifest

      - name: No fetch() in extension pages / SW sources
        run: pnpm run check:no-fetch

      - name: Generated TS/Rust matches manifest (codegen + git diff)
        run: pnpm run check:generated

      - name: Rust tests (bmxt-core)
        run: cargo test -p bmxt-core

      - name: Build WASM
        run: pnpm run build:wasm

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build extension
        run: pnpm run build
