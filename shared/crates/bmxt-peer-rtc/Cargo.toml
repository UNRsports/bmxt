[package]
name = "bmxt-peer-rtc"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Native WebRTC DataChannel peer for BMXt CLI (host ICE)"
license = "Apache-2.0"
publish = false

[dependencies]
bmxt-sync-wire = { path = "../bmxt-sync-wire" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# EN: 0.11 has a DTLS handshake race vs browsers (webrtc-rs#628); use ≥0.13.
webrtc = "0.13"
bytes = "1"
log = "0.4"
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
pretty_assertions = "1.4"
