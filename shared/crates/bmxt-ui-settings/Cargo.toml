[package]
name = "bmxt-ui-settings"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "BMXt UI settings.json v2 load/save/normalize (CLI host + portable contract)"
license = "Apache-2.0"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"
