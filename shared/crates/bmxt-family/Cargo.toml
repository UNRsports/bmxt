[package]
name = "bmxt-family"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "BMXt Family crypto, invite, and RTC handshake codec (CLI + shared contract)"
license = "Apache-2.0"
publish = false

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hkdf = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"
