<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMXt</title>
    <style>
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0d1117;
        color: #c9d1d9;
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        font-size: 12px;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
      }
      .bmxt-static-boot {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        background-color: #0d1117;
        color: #c9d1d9;
      }
      .bmxt-static-boot-bar {
        flex-shrink: 0;
        min-height: 28px;
        background: #161b22;
        border-bottom: 1px solid #30363d;
      }
      .bmxt-static-boot-main {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 0;
        color: #8b949e;
      }
      .bmxt-static-boot-loading {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .bmxt-static-boot-spinner {
        display: inline-block;
        width: 0.75rem;
        height: 0.75rem;
        border: 2px solid #30363d;
        border-top-color: #58a6ff;
        border-radius: 50%;
        animation: bmxt-static-boot-spin 0.75s linear infinite;
      }
      @keyframes bmxt-static-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="bmxt-static-boot" aria-busy="true" aria-live="polite">
        <div class="bmxt-static-boot-bar"></div>
        <div class="bmxt-static-boot-main">
          <span class="bmxt-static-boot-loading">
            <span class="bmxt-static-boot-spinner" aria-hidden="true"></span>
            <span>Loading…</span>
          </span>
        </div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
